name: Tag and Push

on:
  push:
    tags:
    - "v*.*.*"
    # Fork preview tags are owned exclusively by fork-preview-release.yaml.
    # Letting this generic rail see them would race its fail-closed tag checks
    # and publish charts, images, and Python packages outside its evidence.
    - "!v*.kap.*"

concurrency:
  group: generic-release-${{ github.ref }}
  cancel-in-progress: false

# https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#release
# GITHUB_SHA = Last commit in the tagged release
# GITHUB_REF = Tag ref of release refs/tags/<tag_name>
jobs:
  guard-release-coordinate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the tagged source
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Require an annotated release tag on the default branch
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        [[ "${GITHUB_REF_TYPE}" == "tag" ]]
        [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
          echo "release tag is not a strict v-prefixed SemVer coordinate" >&2
          exit 1
        }
        [[ "${GITHUB_REF_NAME}" != *".kap."* ]] || {
          echo "fork preview coordinates are owned exclusively by fork-preview-release.yaml" >&2
          exit 1
        }
        [[ "$(git cat-file -t "${GITHUB_REF}")" == "tag" ]] || {
          echo "generic releases require an annotated tag" >&2
          exit 1
        }
        git fetch --no-tags origin \
          "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
        git merge-base --is-ancestor \
          "${GITHUB_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}" || {
          echo "release tag commit is not reachable from the default branch" >&2
          exit 1
        }

  push-images:
    needs: guard-release-coordinate
    strategy:
      matrix:
        image:
          - controller
          - ui
          - kagent-adk
          - golang-adk
          # A preinstalled Claude Code image must not be published until the
          # Anthropic Commercial Terms gate is explicitly satisfied.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        name: kagent-builder-v0.23.0
        platforms: linux/amd64,linux/arm64
        version: v0.23.0
        use: 'true'
    - name: 'Build Images'
      env:
        DOCKER_BUILD_ARGS: "--push --platform linux/amd64,linux/arm64"
        DOCKER_BUILDER: "docker buildx build"
        DOCKER_REGISTRY: "ghcr.io" # prod for releases, local for dev
      run: |
        # if workflow_dispatch is used, use the version input
        if [ -n "${{ github.event.inputs.version }}" ]; then
          export VERSION=${{ github.event.inputs.version }}
        else
          export VERSION=$(echo "$GITHUB_REF" | cut -c12-)
        fi
        make build-${{ matrix.image }}
  push-helm-chart:
    needs:
    - push-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Build Helm Chart'
      run: |
        # if workflow_dispatch is used, use the version input
        if [ -n "${{ github.event.inputs.version }}" ]; then
          export VERSION=${{ github.event.inputs.version }}
        else
          export VERSION=$(echo "$GITHUB_REF" | cut -c12-)
        fi
        make helm-publish
  release-python-packages:
    needs: guard-release-coordinate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: 'Release Python Packages'
      working-directory: python
      run: |
        # if workflow_dispatch is used, use the version input
        if [ -n "${{ github.event.inputs.version }}" ]; then
          export VERSION=${{ github.event.inputs.version }}
        else
          export VERSION=$(echo "$GITHUB_REF" | cut -c12-)
        fi
        uv sync --all-extras
        # Bump every package version to $VERSION first
        uv version $VERSION --package kagent-core
        uv version $VERSION --package kagent-skills
        uv version $VERSION --package kagent-adk
        uv version $VERSION --package kagent-langgraph
        uv version $VERSION --package kagent-crewai
        uv version $VERSION --package kagent-openai
        uv version $VERSION --package agentsts-core
        uv version $VERSION --package agentsts-adk
        # Update intra-repo dependency lower bounds to match the new version.
        # Without this, a user upgrading e.g. kagent-adk via pip/uv could have
        # older intra-repo siblings still locked at a stale version that may be
        # missing symbols the new package requires.
        for pkg in kagent-core kagent-skills agentsts-core agentsts-adk; do
          find packages -name "pyproject.toml" \
            -exec sed -i "s/\"${pkg}>=[^\"]*\"/\"${pkg}>=${VERSION}\"/g" {} +
        done
        # Build all packages
        uv build --package kagent-core
        uv build --package kagent-skills
        uv build --package kagent-adk
        uv build --package kagent-langgraph
        uv build --package kagent-crewai
        uv build --package kagent-openai
        uv build --package agentsts-core
        uv build --package agentsts-adk
        uv publish --token ${{ secrets.PYPI_TOKEN }}

  release:
    # Only run release after images and helm chart are pushed
    # In the future we can take the chart from the helm action,
    # and build the CLI beforehand.
    needs:
    - push-helm-chart
    - release-python-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Build
      run: |
        # if workflow_dispatch is used, use the version input
        if [ -n "${{ github.event.inputs.version }}" ]; then
          export VERSION=${{ github.event.inputs.version }}
        else
          export VERSION=$(echo "$GITHUB_REF" | cut -c12-)
        fi
        make build-cli
        make helm-version
    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        generate_release_notes: true
        files: |
          go/core/bin/kagent-*
          kagent-*.tgz
