name: Fork immutable preview release

on:
  push:
    tags:
      - "v*.kap.*"

concurrency:
  group: fork-preview-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: "off"
  HELM_VERSION: 3.21.4
  SUBSTRATE_PIN_FILE: .github/gke-preview-substrate-pin.json

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Verify immutable source identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "pilprod/kagent" ]] || {
            echo "fork preview releases are restricted to pilprod/kagent" >&2
            exit 1
          }
          [[ "${GITHUB_REF_TYPE}" == "tag" ]]
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+\.kap\.[0-9]+$ ]]
          [[ "$(git cat-file -t "${GITHUB_REF}")" == "tag" ]] || {
            echo "preview releases require an annotated tag" >&2
            exit 1
          }
          [[ "$(git rev-parse "${GITHUB_REF}^{commit}")" == "${GITHUB_SHA}" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq '.enabled')" == "true" ]] || {
            echo "GitHub immutable releases must be enabled before publishing a preview" >&2
            exit 1
          }

      - name: Verify the Substrate pin contract
        run: ./scripts/test-verify-gke-preview-substrate-pin.sh

      - name: Prove all Go dependencies are public and immutable
        env:
          GONOPROXY: ""
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          ./scripts/verify-gke-preview-substrate-pin.sh "${SUBSTRATE_PIN_FILE}"
          (cd go && GOFLAGS=-mod=readonly go mod download)

      - name: Verify release image and provider CLI pins
        shell: bash
        run: |
          set -euo pipefail
          go_digest='sha256:f83f9c10f9c18d7b9a71d241b63b8824de5a0ad6caea4255406e42b4005320fe'
          wolfi_digest='sha256:19f7a7b40a11c435311e3784bd134c6b6f19677462440da48f96d5c84eefd669'
          alpine_image='alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce'
          codex_version='0.151.0'
          codex_amd64_sha256='605b4b183f22c645f5def63a5b7191767407fb66a6feaec4eaf10b5b7e0058f6'
          codex_arm64_sha256='c1cf2baf375e261c1469381a52dc2c8fd05b6fb45cfff83fed0988fd6c5369b6'
          claude_version='2.1.236'
          claude_amd64_sha256='979acf4877fa3dca24d6d15043022b5005cc8502fdb4c68992dd91651af31731'
          claude_arm64_sha256='56fe9241267b0187538a9cf7dafa0df12d94fd27789fa7207a59c2a0b4121b8f'
          grep -Fx "ARG GO_BUILDER_DIGEST=${go_digest}" go/Dockerfile
          grep -Fx "ARG ALPINE_IMAGE=${alpine_image}" go/Dockerfile
          grep -Fx "ARG WOLFI_BASE_DIGEST=${wolfi_digest}" ui/Dockerfile
          grep -Fx "ARG GO_BUILDER_DIGEST=${go_digest}" go/harness/codex/Dockerfile
          grep -Fx "ARG ALPINE_IMAGE=${alpine_image}" go/harness/codex/Dockerfile
          grep -Fx "ARG CODEX_VERSION=${codex_version}" go/harness/codex/Dockerfile
          grep -Fx "ARG CODEX_AMD64_ARCHIVE_SHA256=${codex_amd64_sha256}" go/harness/codex/Dockerfile
          grep -Fx "ARG CODEX_ARM64_ARCHIVE_SHA256=${codex_arm64_sha256}" go/harness/codex/Dockerfile
          grep -Fx "ARG GO_BUILDER_DIGEST=${go_digest}" go/harness/claude/Dockerfile
          grep -Fx "ARG ALPINE_IMAGE=${alpine_image}" go/harness/claude/Dockerfile
          grep -Fx "ARG CLAUDE_CODE_VERSION=${claude_version}" go/harness/claude/Dockerfile
          grep -Fx "ARG CLAUDE_CODE_AMD64_SHA256=${claude_amd64_sha256}" go/harness/claude/Dockerfile
          grep -Fx "ARG CLAUDE_CODE_ARM64_SHA256=${claude_arm64_sha256}" go/harness/claude/Dockerfile
          if grep -E '^FROM .*:(latest|[0-9]+([.][0-9]+)*)[[:space:]]' \
            go/Dockerfile ui/Dockerfile go/harness/codex/Dockerfile go/harness/claude/Dockerfile; then
            echo "release Dockerfile has an unpinned base image" >&2
            exit 1
          fi

      - name: Verify the current chart runtime image contract
        run: ./scripts/test-fork-preview-release-contract.sh

      - name: Run release-critical Go checks
        working-directory: go
        run: |
          GOFLAGS=-mod=readonly GOWORK=off go test \
            ./harness/codex/... \
            ./harness/claude/... \
            ./harness/runtime/... \
            ./core/v2/translator/codingagent \
            ./core/v2/translator/codex \
            ./core/v2/translator/claude \
            ./core/v2/translator/kagent \
            ./core/v2/controller \
            ./api/v1alpha2 \
            ./api/v1alpha3
          GOFLAGS=-mod=readonly GOWORK=off go vet \
            ./harness/codex/... \
            ./harness/claude/... \
            ./harness/runtime/... \
            ./core/v2/translator/codingagent \
            ./core/v2/translator/codex \
            ./core/v2/translator/claude \
            ./core/v2/translator/kagent

  images:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        component:
          - controller
          - ui
          - golang-adk
          - codex-harness
          # claude-harness is intentionally absent until the Anthropic
          # Commercial Terms gate is explicitly satisfied.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          name: fork-preview
          use: true

      - name: Reject an existing image tag
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          repository="${owner}/kagent/${{ matrix.component }}"
          image="ghcr.io/${repository}:${version}"
          registry_token="$(
            curl --fail --silent --show-error \
              --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              --get \
              --data-urlencode "scope=repository:${repository}:pull" \
              --data-urlencode "service=ghcr.io" \
              https://ghcr.io/token |
              jq -er '.token'
          )" || {
            echo "could not acquire a GHCR read token to prove ${image} is absent" >&2
            exit 1
          }
          status="$(
            curl --location --silent --show-error \
              --output "${RUNNER_TEMP}/ghcr-manifest-check-${{ matrix.component }}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${registry_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repository}/manifests/${version}"
          )" || {
            echo "could not prove ${image} is absent" >&2
            exit 1
          }
          case "${status}" in
            404) ;;
            200)
              echo "refusing to overwrite ${image}" >&2
              exit 1
              ;;
            *)
              echo "could not prove ${image} is absent (registry status ${status})" >&2
              exit 1
              ;;
          esac

      - name: Build and push the exact preview image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${owner}/kagent/${{ matrix.component }}:${version}"
          metadata="${RUNNER_TEMP}/build-${{ matrix.component }}.json"
          make "build-${{ matrix.component }}" \
            VERSION="${version}" \
            DOCKER_REGISTRY=ghcr.io \
            DOCKER_REPO="${owner}/kagent" \
            GO_MODULE=github.com/kagent-dev/kagent/go \
            BUILDX_BUILDER_NAME=fork-preview \
            DOCKER_BUILDER="docker buildx build" \
            DOCKER_BUILD_ARGS="--push --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true --metadata-file ${metadata}"
          digest="$(jq -er '."containerimage.digest"' "${metadata}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          published="$(docker buildx imagetools inspect "${image}" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "${published}" == "${digest}" ]] || {
            echo "published alias does not identify the BuildKit result for ${{ matrix.component }}" >&2
            exit 1
          }
          mkdir -p release
          printf '%s=%s\n' "${{ matrix.component }}" "${digest}" > "release/image-${{ matrix.component }}.txt"
          printf 'subject=%s\n' "${image%:*}" >> "${GITHUB_OUTPUT}"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest the pushed image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.subject }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Upload the image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-image-${{ matrix.component }}
          path: release/image-${{ matrix.component }}.txt
          if-no-files-found: error
          retention-days: 30

  native-external-adapters:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build native adapter archives
        working-directory: go
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_archives() {
            local output_dir="$1"
            mkdir -p "${output_dir}"
            for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
              local os="${target%/*}"
              local arch="${target#*/}"
              for provider in codex claude; do
                local binary="kagent-${provider}-${os}-${arch}"
                local staging_dir
                staging_dir="$(mktemp -d)"
                CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
                  GOFLAGS=-mod=readonly GOWORK=off \
                  go build -trimpath -buildvcs=false \
                    -ldflags="-s -w -X github.com/kagent-dev/kagent/go/core/internal/version.Version=${version} -X github.com/kagent-dev/kagent/go/core/internal/version.GitCommit=${GITHUB_SHA}" \
                    -o "${staging_dir}/${binary}" "./harness/${provider}/cmd"
                tar -C "${staging_dir}" \
                  --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
                  -cf - "${binary}" | gzip -n > "${output_dir}/${binary}.tar.gz"
                rm -rf "${staging_dir}"
              done
            done
            (cd "${output_dir}" && sha256sum ./*.tar.gz > SHA256SUMS)
          }

          rm -rf dist dist-reproducibility-check
          package_archives dist
          package_archives dist-reproducibility-check
          diff -u dist/SHA256SUMS dist-reproducibility-check/SHA256SUMS
          rm -rf dist-reproducibility-check

      - name: Attest native adapter archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: go/dist/*

      - name: Upload native adapter archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-native-external-adapters
          path: go/dist/*
          if-no-files-found: error
          retention-days: 30

  charts:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ env.HELM_VERSION }}

      - name: Install pinned helm-unittest
        run: >-
          helm plugin install https://github.com/helm-unittest/helm-unittest.git
          --version 33c48cac798e465deda9a66c8e6c07c0973cf53d

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject existing chart versions
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          for chart in kagent kagent-crds; do
            repository="${owner}/kagent/helm/${chart}"
            ref="ghcr.io/${repository}:${version}"
            registry_token="$(
              curl --fail --silent --show-error \
                --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
                --get \
                --data-urlencode "scope=repository:${repository}:pull" \
                --data-urlencode "service=ghcr.io" \
                https://ghcr.io/token |
                jq -er '.token'
            )" || {
              echo "could not acquire a GHCR read token to prove ${ref} is absent" >&2
              exit 1
            }
            status="$(
              curl --location --silent --show-error \
                --output "${RUNNER_TEMP}/ghcr-chart-manifest-check-${chart}" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${registry_token}" \
                --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${repository}/manifests/${version}"
            )" || {
              echo "could not prove ${ref} is absent" >&2
              exit 1
            }
            case "${status}" in
              404) ;;
              200)
                echo "refusing to overwrite ${ref}" >&2
                exit 1
                ;;
              *)
                echo "could not prove ${ref} is absent (registry status ${status})" >&2
                exit 1
                ;;
            esac
          done

      - name: Package, push, and verify charts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "${GH_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          scripts/package-fork-preview-charts.sh "${version}" dist
          scripts/package-fork-preview-charts.sh "${version}" dist-reproducibility-check
          for chart in kagent kagent-crds; do
            cmp \
              "dist/${chart}-${version}.tgz" \
              "dist-reproducibility-check/${chart}-${version}.tgz"
          done
          mkdir -p release
          for chart in kagent kagent-crds; do
            archive="dist/${chart}-${version}.tgz"
            output="$(helm push "${archive}" "oci://ghcr.io/${owner}/kagent/helm")"
            digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"${output}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            ref="ghcr.io/${owner}/kagent/helm/${chart}:${version}"
            actual="$(docker buildx imagetools inspect "${ref}" | awk '$1 == "Digest:" { print $2; exit }')"
            [[ "${actual}" == "${digest}" ]]
            printf '%s=%s\n' "${chart}" "${digest}" > "release/chart-${chart}.txt"
          done

      - name: Attest chart archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kagent*.tgz

      - name: Upload chart evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-charts
          path: |
            dist/kagent*.tgz
            release/chart-*.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs:
      - images
      - native-external-adapters
      - charts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: preview-*
          path: release-inputs
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Recheck digests and assemble release evidence
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          controller="$(cut -d= -f2 release-inputs/image-controller.txt)"
          ui="$(cut -d= -f2 release-inputs/image-ui.txt)"
          agent="$(cut -d= -f2 release-inputs/image-golang-adk.txt)"
          codex="$(cut -d= -f2 release-inputs/image-codex-harness.txt)"
          chart="$(cut -d= -f2 release-inputs/chart-kagent.txt)"
          crds="$(cut -d= -f2 release-inputs/chart-kagent-crds.txt)"
          chart_source_tree="$(git rev-parse "${GITHUB_SHA}:helm/kagent")"
          [[ "${chart_source_tree}" =~ ^[0-9a-f]{40}$ ]]
          (cd release-inputs && sha256sum --check SHA256SUMS)
          for pair in \
            "controller:${controller}" \
            "ui:${ui}" \
            "golang-adk:${agent}" \
            "codex-harness:${codex}"; do
            component="${pair%%:*}"
            expected="${pair#*:}"
            ref="ghcr.io/${owner}/kagent/${component}:${version}"
            actual="$(docker buildx imagetools inspect "${ref}" | awk '$1 == "Digest:" { print $2; exit }')"
            [[ "${actual}" == "${expected}" ]]
          done
          for pair in "kagent:${chart}" "kagent-crds:${crds}"; do
            component="${pair%%:*}"
            expected="${pair#*:}"
            ref="ghcr.io/${owner}/kagent/helm/${component}:${version}"
            actual="$(docker buildx imagetools inspect "${ref}" | awk '$1 == "Digest:" { print $2; exit }')"
            [[ "${actual}" == "${expected}" ]]
          done
          jq -n \
            --arg schemaVersion "2" \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg source_repository "https://github.com/${GITHUB_REPOSITORY}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg chart_source_tree "${chart_source_tree}" \
            --arg skills_init_removal_commit "059c01b68584dea113ccdf80f2e356c2d051e02a" \
            --arg chart_version "${version}" \
            --arg controller "ghcr.io/${owner}/kagent/controller@${controller}" \
            --arg ui "ghcr.io/${owner}/kagent/ui@${ui}" \
            --arg agent "ghcr.io/${owner}/kagent/golang-adk@${agent}" \
            --arg codexHarness "ghcr.io/${owner}/kagent/codex-harness@${codex}" \
            --arg application_chart "oci://ghcr.io/${owner}/kagent/helm/kagent@${chart}" \
            --arg crds_chart "oci://ghcr.io/${owner}/kagent/helm/kagent-crds@${crds}" \
            '{
              schemaVersion: ($schemaVersion | tonumber),
              channel: "preview",
              tag: $tag,
              source_repository: $source_repository,
              source_commit: $source_commit,
              chart_source: {
                path: "helm/kagent",
                tree: $chart_source_tree,
                skills_init_removal_commit: $skills_init_removal_commit
              },
              image_refs: {
                controller: $controller,
                ui: $ui,
                agent: $agent
              },
              runtime_images: {
                codexHarness: $codexHarness
              },
              charts: {
                application: {
                  ref: $application_chart,
                  version: $chart_version
                },
                crds: {
                  ref: $crds_chart,
                  version: $chart_version
                }
              }
            }' > release-evidence.json
          jq -e --arg version "${version}" '
            .schemaVersion == 2 and
            .source_repository == "https://github.com/pilprod/kagent" and
            (.source_commit | test("^[0-9a-f]{40}$")) and
            .chart_source.path == "helm/kagent" and
            (.chart_source.tree | test("^[0-9a-f]{40}$")) and
            .chart_source.skills_init_removal_commit == "059c01b68584dea113ccdf80f2e356c2d051e02a" and
            (.image_refs | keys == ["agent", "controller", "ui"]) and
            (.runtime_images | keys == ["codexHarness"]) and
            (.runtime_images | has("claudeHarness") | not) and
            (.charts | keys == ["application", "crds"]) and
            .charts.application.version == $version and
            .charts.crds.version == $version and
            (.charts.application.ref | test("^oci://ghcr.io/pilprod/kagent/helm/kagent@sha256:[0-9a-f]{64}$")) and
            (.charts.crds.ref | test("^oci://ghcr.io/pilprod/kagent/helm/kagent-crds@sha256:[0-9a-f]{64}$"))
          ' release-evidence.json >/dev/null
          sha256sum release-evidence.json > release-evidence.json.sha256

      - name: Publish the immutable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "refusing to overwrite GitHub release ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "kagent fork preview ${GITHUB_REF_NAME}" \
            --notes "Immutable preview candidate for YourOwn.Chat. OCI tags are discovery aliases only; deploy only the digest-qualified references in release-evidence.json."
          gh release upload "${GITHUB_REF_NAME}" \
            release-inputs/*.tgz \
            release-inputs/*.tar.gz \
            release-inputs/SHA256SUMS \
            release-evidence.json \
            release-evidence.json.sha256
          gh release edit "${GITHUB_REF_NAME}" --draft=false
