name: Retired public fork preview release

on:
  push:
    tags:
      - "v*.kap.*"

concurrency:
  group: retired-public-fork-preview-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  reject-public-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the private app-gcp release rail
        shell: bash
        run: |
          printf '%s\n' \
            'Public GHCR fork previews are disabled. Publish gcp-v*.kap.* only through the private app-gcp Pub/Sub and GAR release rail.' >&2
          exit 1
