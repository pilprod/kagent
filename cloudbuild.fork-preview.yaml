timeout: 7200s

options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: "200"
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH
  dynamicSubstitutions: true

steps:
  - id: checkout-reviewed-source
    name: gcr.io/cloud-builders/git:latest@sha256:bfcbd8719280b196bd860e89531c3c9b598daab4a07aef1d17a163c822d569bd
    entrypoint: /bin/sh
    args:
      - -ceu
      - |
        git clone --filter=blob:none --no-tags \
          https://github.com/pilprod/kagent.git /workspace/source
        cd /workspace/source
        git fetch --force origin \
          refs/heads/yourown-chat:refs/remotes/origin/yourown-chat
        git fetch --force origin "${_SOURCE_COMMIT}"
        git checkout --detach "${_SOURCE_COMMIT}"
        test "$$(git rev-parse HEAD)" = "${_SOURCE_COMMIT}"
        git merge-base --is-ancestor "${_SOURCE_COMMIT}" origin/yourown-chat
        remote_tag="$$(git ls-remote --tags origin "refs/tags/v${_VERSION}")"
        test -z "$${remote_tag}"
        test -z "$$(git status --porcelain)"

  - id: build-pinned-release-toolbox
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    args:
      - build
      - --pull
      - --tag
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - --file
      - /workspace/source/.github/cloud-build/fork-preview-tools.Dockerfile
      - /workspace/source

  - id: verify-release-source
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    args:
      - run
      - --rm
      - --volume
      - /workspace:/workspace
      - --workdir
      - /workspace/source
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - /workspace/source/scripts/verify-cloud-build-fork-preview-source.sh
      - ${_VERSION}
      - ${_SOURCE_COMMIT}

  - id: reject-existing-final-refs
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    secretEnv:
      - GHCR_TOKEN
    env:
      - GHCR_USERNAME=${_GHCR_USERNAME}
    args:
      - run
      - --rm
      - --volume
      - /workspace:/workspace
      - --env
      - GHCR_TOKEN
      - --env
      - GHCR_USERNAME
      - --entrypoint
      - python3
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - /workspace/source/scripts/verify-ghcr-fork-preview.py
      - absent
      - ${_VERSION}

  - id: login-ghcr-for-images
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    entrypoint: bash
    secretEnv:
      - GHCR_TOKEN
    env:
      - DOCKER_CONFIG=/docker-config
      - GHCR_USERNAME=${_GHCR_USERNAME}
    volumes:
      - name: docker-config
        path: /docker-config
    args:
      - -ceu
      - |
        printf '%s' "$${GHCR_TOKEN}" | docker login ghcr.io \
          --username "$${GHCR_USERNAME}" --password-stdin

  - id: install-multiarch-emulation
    name: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
    args:
      - --install
      - all

  - id: build-candidate-images
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    entrypoint: bash
    env:
      - DOCKER_CONFIG=/docker-config
      - BUILDX_NO_DEFAULT_ATTESTATIONS=1
    volumes:
      - name: docker-config
        path: /docker-config
    args:
      - /workspace/source/scripts/cloud-build-fork-preview-images.sh
      - build
      - ${_VERSION}
      - ${_SOURCE_COMMIT}
      - $BUILD_ID

  - id: record-buildkit-image-digests
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    args:
      - run
      - --rm
      - --volume
      - /workspace:/workspace
      - --workdir
      - /workspace/source
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - /workspace/source/scripts/cloud-build-fork-preview-images.sh
      - record
      - ${_VERSION}
      - ${_SOURCE_COMMIT}
      - $BUILD_ID

  - id: verify-candidate-image-indexes
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    secretEnv:
      - GHCR_TOKEN
    env:
      - GHCR_USERNAME=${_GHCR_USERNAME}
    args:
      - run
      - --rm
      - --volume
      - /workspace:/workspace
      - --env
      - GHCR_TOKEN
      - --env
      - GHCR_USERNAME
      - --entrypoint
      - python3
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - /workspace/source/scripts/verify-ghcr-fork-preview.py
      - verify-candidates
      - ${_VERSION}
      - --build-id
      - $BUILD_ID
      - --evidence-directory
      - /workspace/release-inputs

  - id: package-and-reproduce-charts
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    args:
      - run
      - --rm
      - --volume
      - /workspace:/workspace
      - --workdir
      - /workspace/source
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - /workspace/source/scripts/cloud-build-fork-preview-charts.sh
      - package
      - ${_VERSION}

  - id: recheck-final-image-refs
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    secretEnv:
      - GHCR_TOKEN
    env:
      - GHCR_USERNAME=${_GHCR_USERNAME}
    args:
      - run
      - --rm
      - --volume
      - /workspace:/workspace
      - --env
      - GHCR_TOKEN
      - --env
      - GHCR_USERNAME
      - --entrypoint
      - python3
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - /workspace/source/scripts/verify-ghcr-fork-preview.py
      - absent
      - ${_VERSION}
      - --category
      - images

  - id: promote-final-image-aliases
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    entrypoint: bash
    env:
      - DOCKER_CONFIG=/docker-config
    volumes:
      - name: docker-config
        path: /docker-config
    args:
      - /workspace/source/scripts/cloud-build-fork-preview-images.sh
      - promote
      - ${_VERSION}
      - ${_SOURCE_COMMIT}
      - $BUILD_ID

  - id: recheck-final-chart-refs
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    secretEnv:
      - GHCR_TOKEN
    env:
      - GHCR_USERNAME=${_GHCR_USERNAME}
    args:
      - run
      - --rm
      - --volume
      - /workspace:/workspace
      - --env
      - GHCR_TOKEN
      - --env
      - GHCR_USERNAME
      - --entrypoint
      - python3
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - /workspace/source/scripts/verify-ghcr-fork-preview.py
      - absent
      - ${_VERSION}
      - --category
      - charts

  - id: publish-final-charts
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    secretEnv:
      - GHCR_TOKEN
    env:
      - GHCR_USERNAME=${_GHCR_USERNAME}
    args:
      - run
      - --rm
      - --volume
      - /workspace:/workspace
      - --workdir
      - /workspace/source
      - --env
      - GHCR_TOKEN
      - --env
      - GHCR_USERNAME
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - /workspace/source/scripts/cloud-build-fork-preview-charts.sh
      - push
      - ${_VERSION}

  - id: verify-all-final-registry-digests
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    secretEnv:
      - GHCR_TOKEN
    env:
      - GHCR_USERNAME=${_GHCR_USERNAME}
    args:
      - run
      - --rm
      - --volume
      - /workspace:/workspace
      - --env
      - GHCR_TOKEN
      - --env
      - GHCR_USERNAME
      - --entrypoint
      - python3
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - /workspace/source/scripts/verify-ghcr-fork-preview.py
      - verify
      - ${_VERSION}
      - --evidence-directory
      - /workspace/release-inputs

  - id: assemble-deployment-evidence
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    args:
      - run
      - --rm
      - --volume
      - /workspace:/workspace
      - --entrypoint
      - python3
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - /workspace/source/scripts/assemble-fork-preview-release-evidence.py
      - ${_VERSION}
      - ${_SOURCE_COMMIT}
      - /workspace/release-inputs
      - /workspace/chart-dist
      - /workspace/release

  - id: verify-release-receipt
    name: gcr.io/cloud-builders/docker:latest@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    args:
      - run
      - --rm
      - --volume
      - /workspace:/workspace
      - --entrypoint
      - python3
      - gcr.io/$PROJECT_ID/kagent-fork-preview-tools:$BUILD_ID
      - /workspace/source/scripts/finalize-cloud-build-fork-preview-receipt.py
      - $BUILD_ID
      - $PROJECT_ID
      - ${_SOURCE_COMMIT}
      - ${_VERSION}
      - /workspace/release

  - id: upload-release-receipt
    name: gcr.io/cloud-builders/gcloud:latest@sha256:3bcfea90f299ae18ced1c0bce4ec035bc4d19049f16c22690ba7c4e730478fbc
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud storage cp ./* \
          "gs://${_EVIDENCE_BUCKET}/kagent/${_VERSION}/$BUILD_ID/"
        printf 'release receipt: gs://%s/kagent/%s/%s/\n' \
          "${_EVIDENCE_BUCKET}" "${_VERSION}" "$BUILD_ID"
    dir: /workspace/release

availableSecrets:
  secretManager:
    - versionName: ${_GHCR_SECRET_VERSION}
      env: GHCR_TOKEN
